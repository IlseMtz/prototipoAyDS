<h2 class="mt-4">Existencias de Productos</h2>

<!--  Formulario de búsqueda -->
<form class="mb-3 d-flex gap-3 flex-wrap" (ngSubmit)="filtrar()">
  <div>
    <input type="text" class="form-control" placeholder="Buscar por código" [(ngModel)]="filtroCodigo" name="codigo" />
  </div>
  <div>
    <input type="text" class="form-control" placeholder="Buscar por nombre" [(ngModel)]="filtroNombre" name="nombre" />
  </div>
  <div>
    <button type="submit" class="btn" style="background-color: #567c8d; color: white;">Buscar</button>
    <button type="button" class="btn btn-secondary ms-2" (click)="limpiarFiltros()">Limpiar</button>
  </div>
</form>

<!--  Tabla con los resultados -->
<table class="table table-striped table-bordered mt-3">
  <thead class="table-dark">
    <tr>
      <th scope="col">Código</th>
      <th scope="col">Nombre</th>
      <th scope="col">Cantidad</th>
      <th scope="col">Precio</th>
    </tr>
  </thead>
  <tbody>
    @for (item of productosFiltrados; track item.codigo) {
      <tr>
        <td>{{ item.codigo }}</td>
        <td>{{ item.nombre }}</td>
        <td>{{ item.cantidad }}</td>
        <td>{{ item.precio }}</td>
      </tr>
    }
  </tbody>
</table>
