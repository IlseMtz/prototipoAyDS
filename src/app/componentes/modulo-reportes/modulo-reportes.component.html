<form (ngSubmit)="generarReporte()" class="border p-4 rounded  mb-4">
  <div class="row g-3">
    <div class="col-md-6">
      <label for="fechaInicio" class="form-label fw-bold">Fecha Inicio:</label>
      <input type="date" id="fechaInicio" [(ngModel)]="fechaInicio" name="inicio" required class="form-control">
    </div>
    <div class="col-md-6">
      <label for="fechaFin" class="form-label fw-bold">Fecha Fin:</label>
      <input type="date" id="fechaFin" [(ngModel)]="fechaFin" name="fin" required class="form-control">
    </div>
  </div>
  <div class="text-center mt-3">
    <button type="submit" class="btn btn-primary px-4">📄 Generar Reporte</button>
  </div>
</form>

<div *ngIf="ventas.length > 0" #reportePDF class="table-responsive">
  <h3 class="text-center mb-3 text-primary">📊 Reporte de Ventas</h3>
  <table class="table table-striped table-bordered align-middle">
    <thead class="table-dark text-center">
      <tr>
        <th>Producto</th>
        <th>Cantidad Vendida</th>
        <th>Precio Unitario</th>
        <th>Total</th>
        <th>Fecha</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let venta of ventas" class="text-center">
        <td>{{ venta.nombre }}</td>
        <td>{{ venta.cantidadVendida }}</td>
        <td>${{ venta.precioUnitario }}</td>
        <td>${{ venta.total }}</td>
        <td>{{ venta.fecha | date:'short' }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-1" (click)="editarVenta(venta)">✏️ Editar</button>
          <button class="btn btn-sm btn-danger" (click)="eliminarVenta(venta.id)">🗑️ Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="mt-3 d-flex justify-content-center gap-3">
  <button class="btn btn-outline-primary" (click)="exportarPDF()">📥 Exportar PDF</button>
  <button class="btn btn-outline-success" (click)="exportarExcel()">📊 Exportar Excel</button>
</div>
